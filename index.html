    <div id="status"></div>

      <button id="bDraw">Durang taklif qilish</button>
      <button id="bOnline">Do'st bilan online</button>

    <div class="bar" id="ask" style="display: none">
      <button id="bYes">Ha</button><button id="bNo">Yo'q</button>
    </div>
    <div class="bar" id="pick" style="display: none">
      <button data-c="w">Oq</button><button data-c="b">Qora</button
      ><button data-c="r">Tasodifiy</button>
    </div>
    <div id="linkbox">
      <input id="link" readonly /><button id="bCopy">Nusxa olish</button>
    </div>

    <footer>
      <a href="https://t.me/Sardorbek0limov" target="_blank" rel="noopener"

      >
